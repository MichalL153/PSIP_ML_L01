
services:
  postgis:
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw haslo PostgreSQL}
      POSTGRES_DB: ${POSTGRES_DB:-psip}
    ports:
      - "${POSTGRES_PORT:?Ustaw port srodowiska}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30

  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    profiles: ["tools"]
    environment:
      PGHOST: postgis
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-psip}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Ustaw haslo PostgreSQL}
      PGDATABASE: ${POSTGRES_DB:-psip}
      H3_RESOLUTIONS: ${H3_RESOLUTIONS:-6,7,8}
    volumes:
      - ./app:/app:ro
      - ./data:/data:ro
    depends_on:
      postgis:
        condition: service_healthy
    command: ["python3", "/app/load.py"]

volumes:
  pgdata:
    name: remote-db-${ENVIRONMENT:?Ustaw srodowisko}-pgdata
