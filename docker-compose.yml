services:
  postgis:
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw haslo PostgreSQL}
      POSTGRES_DB: ${POSTGRES_DB:-psip}
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro

  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Ustaw haslo PostgreSQL}
    volumes:
      - ./app:/app:ro
      - ./data:/data:ro
    command: ["tail", "-f", "/dev/null"]

volumes:
  pgdata:
